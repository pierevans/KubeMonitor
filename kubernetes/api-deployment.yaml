apiVersion: apps/v1

kind: Deployment

metadata:
  name: api-deployment
  labels:
    app: api-kube-monitor
    type: backend


spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-kube-monitor
      type: backend
  template:
    metadata:
      labels:
        app: api-kube-monitor
        type: backend
    spec:
      containers:
        - name: api-container
          image: api-kube-monitor
          ports:
            - containerPort: 8000


