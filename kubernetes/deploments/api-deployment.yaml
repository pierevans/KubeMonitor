apiVersion: apps/v1

kind: Deployment

metadata:
  name: api-deployment
  labels:
    app: api-kube-monitor
    type: backend

spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-kube-monitor
      type: backend
  template:
    metadata:
      name: api-pod
      labels:
        app: api-kube-monitor
        type: backend
    spec:
      containers:
        - name: api-container
          image: api-kube-monitor
          ports:
            - containerPort: 8000

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"