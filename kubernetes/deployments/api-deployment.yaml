apiVersion: apps/v1

kind: Deployment

metadata:
  name: api-deployment
  labels:
    app: api-kube-monitor
    type: backend

spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-kube-monitor
      type: backend
  template:
    metadata:
      name: api-pod
      labels:
        app: api-kube-monitor
        type: backend
    spec:
      serviceAccountName: kube-monitor-api
      containers:
        - name: api-container
          image: 798319585604.dkr.ecr.us-east-1.amazonaws.com/kube-monitor-api-ecr-repo:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          env:
            - name: ENABLE_CPU_SIMULATION
              value: "true"

            - name: ENABLE_POD_CRASH_SIMULATION
              value: "true"
